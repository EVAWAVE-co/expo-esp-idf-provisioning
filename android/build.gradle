plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.espidfprovisioning'
version = '0.1.0'

repositories {
  google()
  mavenCentral()
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.espidfprovisioning"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.github.espressif:esp-idf-provisioning-android:lib-2.4.4'
  implementation 'org.greenrobot:eventbus:3.3.1'
}
