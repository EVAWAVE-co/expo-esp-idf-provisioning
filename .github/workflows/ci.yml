name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform android --no-install
        working-directory: example
      - run: >-
          ./gradlew
          :evawave-expo-esp-idf-provisioning:compileDebugKotlin
          :evawave-expo-esp-idf-provisioning:lintDebug
          --no-daemon
        working-directory: example/android

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
      - run: xcodebuild -version
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform ios --no-install
        working-directory: example
      - run: pod install
        working-directory: example/ios
      - run: >-
          xcodebuild
          -workspace ESPIDFProvisioningExample.xcworkspace
          -scheme EspIdfProvisioning
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: example/ios
