name: Bug report
description: Report reproducible provisioning behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include Wi-Fi passwords, proof-of-possession values, or private device identifiers.
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Expo SDK, React Native, OS/device, ESP chip, ESP-IDF, transport, and security version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
